name: infrastructure

on:
  push:
    branches: [master]
    paths:
      - "infrastructure/**"
  pull_request:
    branches: [master]
    paths:
      - "infrastructure/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate infrastructure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8"

      - name: Validate TOML examples against schemas
        run: |
          python3 - <<'EOF'
          import json, tomllib, glob
          import jsonschema
          # Each example is one environment with a table per component. Validate
          # each table against that component's schema (the file names differ).
          COMPONENTS = ["server", "scheduler", "worker"]
          for path in sorted(glob.glob("infrastructure/config/examples/*.toml")):
              data = tomllib.load(open(path, "rb"))
              for component in COMPONENTS:
                  if component not in data:
                      continue
                  schema = json.load(open(f"infrastructure/config/schema/{component}.schema.json"))
                  jsonschema.validate(data[component], schema)
              print(f"OK {path}")
          EOF

      - name: Lint shell scripts
        run: |
          shellcheck infrastructure/scripts/*.sh

      - name: Terraform/OpenTofu init + validate
        working-directory: infrastructure/terraform
        run: |
          tofu init -backend=false
          tofu validate

      - name: Kubernetes manifest lint (kubeconform)
        run: |
          if command -v kubeconform >/dev/null 2>&1; then
            kubeconform infrastructure/kubernetes/manifests.yaml
          else
            echo "kubeconform not installed; skipping manifest lint"
          fi
