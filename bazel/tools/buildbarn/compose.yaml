# =============================================================================
# Buildbarn for Bazel — local stack
# =============================================================================
# Two modes:
#
#   Cache only (default). Bazel uses this as --remote_cache. The scheduler
#   also starts, because the frontend needs it to answer capability queries:
#     docker compose -f bazel/tools/buildbarn/compose.yaml up -d --wait
#     bazel build --config=remote-cache //cli:sandbox
#
#   Cache and execution (profile "exec"). Only useful once the build has a
#     Linux execution platform. See bazel/README.md:
#     docker compose -f bazel/tools/buildbarn/compose.yaml --profile exec up -d --wait
#
# The image tags come from the bb-deployments reference release. Update them
# together, as one set, from that repository's README.
# =============================================================================

name: buildbarn

x-bb-storage: &bb-storage ghcr.io/buildbarn/bb-storage:20260906T092937Z-ae61334
x-bb-exec: &bb-exec ghcr.io/buildbarn/bb-scheduler:20261008T101024Z-582d07f
x-bb-worker: &bb-worker ghcr.io/buildbarn/bb-worker:20261008T101024Z-582d07f

services:
  # One-shot. Creates the state directories that Buildbarn expects to exist,
  # because bb-storage does not create them. The reference run.sh does the same
  # on the host. Here it runs inside the named volumes.
  init:
    image: busybox:1.37
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /storage-cas/persistent_state /storage-ac/persistent_state /storage-fsac/persistent_state
        chmod 0700 /storage-cas/persistent_state /storage-ac/persistent_state /storage-fsac/persistent_state
        mkdir -p /worker/build /worker/cache
        chmod 0700 /worker/cache
    volumes:
      - storage-cas:/storage-cas
      - storage-ac:/storage-ac
      - storage-fsac:/storage-fsac
      - worker-data:/worker
    restart: "no"

  # ---------------------------------------------------------------------------
  # Cache: frontend (Bazel connects here) and one storage node
  # ---------------------------------------------------------------------------
  frontend:
    image: *bb-storage
    command: ["/config/frontend.jsonnet"]
    depends_on:
      scheduler:
        condition: service_started
      storage:
        condition: service_started
    ports:
      # Loopback by default. The cache has no authentication.
      - "${BUILDBARN_BIND:-127.0.0.1}:${BUILDBARN_CACHE_PORT:-8980}:8980"
    volumes:
      - ./config:/config:ro
    restart: unless-stopped

  storage:
    image: *bb-storage
    command: ["/config/storage.jsonnet"]
    volumes:
      - ./config:/config:ro
      - storage-cas:/storage-cas
      - storage-ac:/storage-ac
      - storage-fsac:/storage-fsac
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Execution (profile "exec"): scheduler, worker, and a Linux runner
  # ---------------------------------------------------------------------------
  # Runs in the default profile too. The frontend asks the scheduler for the
  # server's capabilities, and Bazel asks the frontend before any build, even a
  # cache-only one. With no worker attached, the scheduler executes nothing.
  scheduler:
    image: *bb-exec
    command: ["/config/scheduler.jsonnet"]
    volumes:
      - ./config:/config:ro
    depends_on:
      - storage
    restart: unless-stopped

  # Copies the bb_runner binary into the shared volume. The runner waits for it.
  runner-installer:
    profiles: ["exec"]
    image: ghcr.io/buildbarn/bb-runner-installer:20261008T101024Z-582d07f
    volumes:
      - bb-runner:/bb

  worker:
    profiles: ["exec"]
    image: *bb-worker
    command: ["/config/worker.jsonnet"]
    volumes:
      - ./config:/config:ro
      - worker-data:/worker
    depends_on:
      init:
        condition: service_completed_successfully
      scheduler:
        condition: service_started
      storage:
        condition: service_started
    restart: unless-stopped

  runner:
    profiles: ["exec"]
    # Pinned by digest, as in the reference. The runner executes the actions.
    image: ghcr.io/catthehacker/ubuntu:act-22.04@sha256:dd7654ffb01d5b7b54b23b9ce928a1f7f2d08c7b3d7e320b6574b55d7ccde78b
    command:
      - sh
      - -c
      - 'while ! test -f /bb/installed; do sleep 1; done; exec /bb/bb_runner /config/runner.jsonnet'
    # Actions get no network access.
    network_mode: none
    volumes:
      - ./config:/config:ro
      - bb-runner:/bb
      - worker-data:/worker
    depends_on:
      - runner-installer
    restart: unless-stopped

volumes:
  storage-cas:
  storage-ac:
  storage-fsac:
  bb-runner:
  worker-data:
