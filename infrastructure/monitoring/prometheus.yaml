global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  - "alerting-rules.yaml"
  - "recording-rules.yaml"

scrape_configs:
  # Single serve process: server, scheduler, and worker all live in one
  # `sandbox serve` binary. /metrics is served on the main 8080 listener
  # (not a separate 9090 port).
  - job_name: "sandbox-server"
    static_configs:
      - targets:
        # K8s: sandbox-server.sandbox.svc:8080
        # Bare-metal (node_exporter-style): <host>:8080
    metrics_path: /metrics
    scrape_interval: 10s
