name: Build system

# Runs the Bazel build and tests on a plain runner. The Rust, Python, Node and
# protoc toolchains come from Bazel's own repository rules, not the runner.
# See docs/build-system.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. A job that writes asks for the scope it needs.
permissions:
  contents: read

jobs:
  bazel:
    name: Bazel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android && df -h /
      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4 # 0.14.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Bazel build
        run: bazel build //...
      - name: Bazel test
        run: bazel test //...
