[package]
name = "wasm-tools"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "fd_tool"
path = "fd_tool.rs"