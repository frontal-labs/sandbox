[package]
name = "sandbox-server"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sandbox"
authors = ["Frontal Labs"]
title = "Sandbox Server"
description = "API server for the sandbox system"

[dependencies]
sandbox-types = { path = "../sandbox-types", features = ["openapi"] }
sandbox-scheduler = { path = "../sandbox-scheduler" }
sandbox-session = { path = "../sandbox-session" }
sandbox-vfs = { path = "../sandbox-vfs" }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
hyper = { workspace = true }
utoipa = { workspace = true }
argon2 = { workspace = true }
blake3 = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[features]
default = []