[package]
name = "cli"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sandbox"
authors = ["Frontal Labs"]
description = "CLI for the sandbox system"

[lib]
# Named cli_lib to match the Bazel target (cli/BUILD.bazel) and cli/src/main.rs.
name = "cli_lib"
path = "src/lib.rs"

[[bin]]
name = "frontal-sandbox"
path = "src/main.rs"

[dependencies]
frontal-sandbox-sdk = { path = "../sdks/rust" }
sandbox-types = { path = "../crates/sandbox-types" }
sandbox-session = { path = "../crates/sandbox-session" }
sandbox-server = { path = "../crates/sandbox-server" }
sandbox-vmm = { path = "../crates/sandbox-vmm" }
sandbox-wasm = { path = "../crates/sandbox-wasm" }
sandbox-scheduler = { path = "../crates/sandbox-scheduler" }
sandbox-trace = { path = "../crates/sandbox-trace" }
sandbox-runtime = { path = "../crates/sandbox-runtime" }
sandbox-vfs = { path = "../crates/sandbox-vfs" }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]

[features]
default = []
# The Postgres state store (PLAN §4.8, M5). See `serve --database-url`.
clustered = ["sandbox-server/clustered"]
# Contained runner tests require Linux with delegated cgroup v2.
# Enable with `--features contained-tests` when running in a suitable environment.
contained-tests = []

# The worker serves gRPC over a Unix socket, so only Unix builds have it.
[target.'cfg(unix)'.dependencies]
sandbox-worker = { path = "../crates/sandbox-worker" }
