# cargo-audit policy. `deny.toml` holds the same advisory decisions for
# cargo-deny; keep the two lists in step. cargo-audit reads the whole
# Cargo.lock, so it also sees entries the build does not compile.
[advisories]
ignore = [
    # The unmaintained-crate advisories below have no fix on their current
    # paths. Each is explained in deny.toml.
    "RUSTSEC-2024-0436", # paste via deno_v8
    "RUSTSEC-2024-0449", # unsafe-libyaml via serde_yaml 0.9 via utoipa 4
    # Lockfile only. sqlx-sqlite 0.9.0 caps libsqlite3-sys below 0.38, so the
    # fix (>=0.39.0) cannot be selected without leaving sqlx 0.9. No build
    # compiles libsqlite3-sys (`cargo tree --all-features` shows no path).
    # Remove this ignore once sqlx pulls a patched libsqlite3-sys.
    "RUSTSEC-2026-0459",
    # chrono and humantime were declared unmaintained (chronotope/chrono#1768);
    # no fixed version exists. Both are transitive of object_store 0.14 (and
    # sqlx via the chrono feature). Tracked with the object_store upgrade;
    # explained in deny.toml.
    "RUSTSEC-2026-0542", # humantime wraps chrono; via object_store 0.14
    "RUSTSEC-2026-0543", # chrono unmaintained; via object_store 0.14 and sqlx
]
