[package]
name = "sandbox-worker"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sandbox"
authors = ["Frontal Labs"]
title = "Sandbox Worker"
description = "Worker process for the sandbox system"

[dependencies]
sandbox-types = { path = "../sandbox-types" }
sandbox-session = { path = "../sandbox-session" }
sandbox-proto = { path = "../sandbox-proto" }
ulid = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
tokio-stream = { workspace = true, features = ["net"] }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
seccompiler = { workspace = true, optional = true }
rustix = { workspace = true }
nix = { workspace = true }

[features]
default = []
seccomp = ["seccompiler"]