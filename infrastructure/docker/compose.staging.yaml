# Staging compose overlay.
#
# Extends docker/compose.yaml for the staging environment. Same shape as
# compose.prod.yaml (TLS + config file) but with staging-tuned limits and
# separate named volumes so staging and prod state never mix. /metrics is on
# the main 8080 port (no separate metrics port).
#
# Deploy with:
#
#   docker compose -f docker/compose.yaml -f infrastructure/docker/compose.staging.yaml up -d
#
# The .buildkite staging pipeline (deploy-staging.sh) builds the image and
# rolls out with this file, then runs infrastructure/scripts/smoke.sh.

name: frontal-sandbox-staging

services:
  sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:-1.95}
        DEBIAN_SUITE: ${DEBIAN_SUITE:-bookworm}
    image: ${SANDBOX_IMAGE:-frontal-sandbox:staging}
    restart: unless-stopped
    stop_grace_period: 30s

    ports:
      # Single port: /metrics is on the same 8080 listener, not a separate 9090.
      - "${SANDBOX_HOST_BIND:-0.0.0.0}:${SANDBOX_PORT:-8080}:8080"

    environment:
      SANDBOX_CONFIG: /etc/sandbox/config.toml
      RUST_BACKTRACE: ${RUST_BACKTRACE:-1}

    volumes:
      - sandbox-state:/var/lib/sandbox
      - ./config:/etc/sandbox:ro
      - sandbox-tls:/etc/sandbox/tls:ro

    command: ["serve", "--config", "/etc/sandbox/config.toml"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${SANDBOX_PIDS_LIMIT:-512}
    mem_limit: ${SANDBOX_MEM_LIMIT:-4g}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/openapi.json"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  sandbox-state:
    name: ${SANDBOX_STATE_VOLUME:-frontal-sandbox-state-staging}
  sandbox-tls:
    name: ${SANDBOX_TLS_VOLUME:-frontal-sandbox-tls-staging}
