name: Examples Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  examples:
    name: TypeScript examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      # The TypeScript SDK is a file: dependency of most examples. Build it so
      # its declared entry points resolve when the examples typecheck.
      - run: npm ci
      - name: Build SDK
        run: npm run build --workspace @frontal-labs/sandbox-sdk
      - name: Typecheck every example
        run: |
          set -euo pipefail
          for dir in examples/*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(basename "$dir")
            echo "::group::examples/$name"
            (cd "$dir" && npm ci && npm run build)
            echo "::endgroup::"
          done
