# Frontal Sandbox Buildkite pipeline.
#
# Stages: lint -> build -> test (parallel) -> deploy-staging (main) ->
#         approve -> deploy-prod.
#
# Upload with:  buildkite-agent pipeline upload .buildkite/pipeline.yml
#
# See .buildkite/README.md for the full design and the secrets this pipeline
# requires.

env:
  RUSTY_V8_MIRROR: "https://github.com/denoland/rusty_v8/releases/download"
  RUSTY_V8_MIRROR_FALLBACK: "1"
  V8_FROM_SOURCE: "0"
  CARGO_TERM_COLOR: "always"
  RUSTFLAGS: "-D warnings"

agents:
  # CI runs on the default queue; prod deploys run on the deploy queue.
  - queue: "default"
  - queue: "deploy"

steps:

  # ---------------------------------------------------------------- CI
  - label: ":check: lint"
    command: ".buildkite/scripts/lint.sh"
    if_changed: |
      crates/**/*.rs
      crates/**/Cargo.toml
      Cargo.toml
      Cargo.lock
      sdks/typescript/**/*.ts
      sdks/typescript/**/*.tsx
      sdks/typescript/**/*.json
      sdks/python/**/*.py
      sdks/python/**/pyproject.toml
      sdks/python/**/requirements*.txt
      **/*.sh
      **/BUILD.bazel
      **/MODULE.bazel
      **/.bazelrc
      **/biome.json
      **/clippy.toml
      **/rustfmt.toml
      **/deny.toml
    key: "lint"
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  - label: ":hammer: build"
    command: ".buildkite/scripts/build.sh"
    depends_on: "lint"
    artifact_paths:
      - "target/release/sandbox"
      - "dist/**"
      - "bazel-out/**"
    key: "build"
    timeout_in_minutes: 45
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  - label: ":test_and_run: rust tests"
    command: ".buildkite/scripts/test.sh"
    depends_on: "build"
    parallelism: 2
    if_changed: |
      crates/**/*.rs
      crates/**/Cargo.toml
      Cargo.toml
      Cargo.lock
      benchmarks/**/*.rs
    artifact_paths:
      - "target/junit/*.xml"
    key: "test"
    timeout_in_minutes: 30
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  - label: ":test_and_run: bazel tests"
    command: "bazel test //... --test_output=errors"
    depends_on: "build"
    parallelism: 2
    if_changed: |
      crates/**/*.rs
      crates/**/Cargo.toml
      cli/**/*.rs
      benchmarks/**/*.rs
      sdks/**/*.ts
      sdks/**/*.tsx
      sdks/**/*.py
      **/BUILD.bazel
      **/MODULE.bazel
      Cargo.toml
      Cargo.lock
    artifact_paths:
      - "bazel-out/**"
    key: "bazel-test"
    timeout_in_minutes: 40
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  - label: ":typescript: SDK tests"
    command: |
      bun install --frozen-lockfile
      bun test --workspace @frontal-labs/sandbox-sdk
    depends_on: "build"
    if_changed: |
      sdks/typescript/**/*.ts
      sdks/typescript/**/*.tsx
      sdks/typescript/**/*.json
      sdks/typescript/package.json
      sdks/typescript/pnpm-lock.yaml
    artifact_paths:
      - "sdks/typescript/junit/*.xml"
    key: "ts-test"
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  - label: ":python: SDK tests"
    command: |
      python3.12 -m venv .venv
      . .venv/bin/activate
      python3.12 -m pip install --quiet -e "sdks/python[dev]"
      python3.12 -m pytest sdks/python/tests -q --junitxml=target/junit/python.xml
    depends_on: "build"
    if_changed: |
      sdks/python/**/*.py
      sdks/python/**/pyproject.toml
      sdks/python/**/requirements*.txt
    artifact_paths:
      - "target/junit/python.xml"
    key: "py-test"
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  - label: ":annotation: test results"
    command: |
      buildkite-agent annotate --style "info" --context "test-results" \
        "JUnit results uploaded as artifacts. See the Artifacts tab."
    depends_on:
      - "test"
      - "bazel-test"
      - "ts-test"
      - "py-test"
    if: "build.pull_request.id != null || build.branch == pipeline.default_branch"
    key: "annotate"
    timeout_in_minutes: 1

  # ---------------------------------------------------------------- CD
  - label: ":rocket: deploy to staging"
    command: ".buildkite/scripts/deploy-staging.sh"
    depends_on: "annotate"
    if: "build.branch == pipeline.default_branch"
    key: "deploy-staging"
    timeout_in_minutes: 30
    retry:
      automatic:
        - exit_status: -1
          limit: 1

  - label: ":lock: approve production deploy"
    block: "Deploy to production?"
    key: "prod-approval"
    if: "build.branch == pipeline.default_branch"

  - label: ":rocket: deploy to production"
    command: ".buildkite/scripts/deploy-prod.sh"
    depends_on: "prod-approval"
    if: "build.branch == pipeline.default_branch"
    concurrency: 1
    concurrency_group: "${BUILDKITE_PIPELINE_SLUG}/prod-deploy"
    timeout_in_minutes: 30
    retry:
      automatic:
        - exit_status: -1
          limit: 1