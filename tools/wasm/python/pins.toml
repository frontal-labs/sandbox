# BLAKE3 pins for the CPython artifacts that tools/wasm/python/build.sh writes. The
# conformance script refuses artifacts that do not match. A rebuild that changes a hash is
# a deliberate change: update these lines with the new hashes, in the same commit.
[python]
version = "3.13.1"
# python.wasm and the zip rebuild to these exact bytes: SOURCE_DATE_EPOCH is fixed, the zip has
# fixed times and sorted entries, and CPython is configured --without-mimalloc, because mimalloc
# seeds from the platform's randomness. python-init.wasm is not pinned: its initialised data
# still differs by four bytes between builds (a value captured at initialisation, probably a
# clock reading). It is checked by conformance and by the install's reactor_hash instead.
python_wasm = "7ab396b10a39345dc862cf2b309f6a2b43c86ed665a03d065055a7029d9e14ac"
python313_zip = "e858bea64ce5ef1a4ef1d8a02a073a8ae700336b70e228b38836a75f2e4869c1"
