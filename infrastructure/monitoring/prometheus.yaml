global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  - "alerting-rules.yaml"
  - "recording-rules.yaml"

scrape_configs:
  - job_name: "sandbox-server"
    static_configs:
      - targets:
        # - sandbox-server.sandbox.svc:9090
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "sandbox-scheduler"
    static_configs:
      - targets:
        # - sandbox-scheduler.sandbox.svc:9090
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "sandbox-worker"
    static_configs:
      - targets:
        # - sandbox-worker.<node>:9090
    metrics_path: /metrics
    scrape_interval: 10s
