[package]
name = "sandbox-session"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sandbox"
authors = ["Frontal Labs"]
title = "Sandbox Session"
description = "Session trait and isolate backend for the sandbox system"

[dependencies]
sandbox-types = { path = "../sandbox-types" }
sandbox-vfs = { path = "../sandbox-vfs" }
sandbox-trace = { path = "../sandbox-trace" }
sandbox-cas = { path = "../sandbox-cas" }
sandbox-runtime = { path = "../sandbox-runtime" }
sandbox-wasm = { path = "../sandbox-wasm" }
sandbox-shell = { path = "../sandbox-shell" }
sandbox-policy = { path = "../sandbox-policy" }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
futures = { workspace = true }

[features]
default = []