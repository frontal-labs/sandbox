name: CodeQL Analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '15 5 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust is not scanned here. CodeQL's Rust support on this runner has not
        # been verified, so it is left out rather than claimed.
        language: ['javascript-typescript', 'actions']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      # Results are kept as a workflow artifact. Uploading them to code scanning
      # needs GitHub Code Security, which this private repository does not have yet.
      # Set upload back to true once that is enabled.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: false
          output: sarif-results
      - name: Keep the SARIF results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: warn
