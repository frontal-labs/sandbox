[workspace]
resolver = "2"
members = [
    "crates/sandbox-types",
    "crates/sandbox-proto",
    "crates/sandbox-vfs",
    "crates/sandbox-cas",
    "crates/sandbox-shell",
    "crates/sandbox-runtime",
    "crates/sandbox-wasm",
    "crates/sandbox-session",
    "crates/sandbox-snapshot",
    "crates/sandbox-vmm",
    "crates/sandbox-guest",
    "crates/sandbox-promote",
    "crates/sandbox-policy",
    "crates/sandbox-trace",
    "crates/sandbox-worker",
    "crates/sandbox-scheduler",
    "crates/sandbox-server",
    "sdks/rust",
    "cli",
    "benchmarks",
    "benchmarks/load",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sandbox"
authors = ["Frontal Labs"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
parking_lot = "0.12"
proptest = "1"
criterion = "0.5"
dashmap = "6"
ulid = { version = "1", features = ["serde"] }
blake3 = "1"
object_store = "0.14"
zstd = "0.14"
# Wasmtime's default features minus `profiling`: that feature links ittapi
# (GPL-2.0-only) and fxprof-processed-profile, which deny.toml rejects.
wasmtime = { version = "36.0.20", default-features = false, features = ["async", "gc", "gc-drc", "gc-null", "wat", "parallel-compilation", "cranelift", "pooling-allocator", "demangle", "addr2line", "coredump", "debug-builtins", "runtime", "component-model", "threads", "stack-switching", "std"] }
deno_core = { version = "0.413", features = ["v8"] }
deno_web = "0.291"
deno_url = "0.222"
deno_console = "0.222"
deno_webidl = "0.260"
async-stream = "0.3"
futures = "0.3"
bytes = "1"
http = "1"
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
async-trait = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
pin-project = "1"
pin-utils = "0.1"
insta = "1"
clap = { version = "4", features = ["derive"] }
notify = "8"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
swc_core = { version = "82", features = ["common", "ecma_ast", "ecma_parser", "ecma_codegen", "ecma_visit", "ecma_transforms", "ecma_transforms_typescript"] }
hyperlocal = "0.8"
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
tonic-prost-build = "0.14"
tonic-prost = "0.14"
tokio-stream = "0.1"
hyper-util = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
firecracker = "0.1"
vsock = "0.4"
redb = "4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
flate2 = "1"
# Default features are off: they add the MySQL driver (pulls in the `rsa` crate,
# RUSTSEC-2023-0071, with no fix), which the clustered scheduler does not use.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
tonic = { version = "0.14", features = ["tls-ring", "transport"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["limit", "timeout", "retry"] }
utoipa = { version = "6", features = ["axum_extras", "chrono", "yaml"] }
argon2 = { version = "0.6", features = ["rand_core"] }
rustls = { version = "0.23", features = ["std"] }
ipnet = "2"
seccompiler = "0.5"
rustix = { version = "0.38", features = ["process", "fs", "net", "mount"] }
nix = { version = "0.28", features = ["fs"] }
brush-parser = "0.2"
uutils_core = { version = "0.0.25", features = ["fs"] }
glob = "0.3"
wasmtime-wasi = { version = "36.0.20", features = ["preview1"] }
sysinfo = "0.30"
# grep. The crate is already in Cargo.lock through other dependencies.
regex = "1"
hdrhistogram = "7"
indicatif = "0.18"
csv = "1"
deno_error = "0.7"
sandbox-types = { path = "crates/sandbox-types" }
frontal-sandbox-sdk = { path = "sdks/rust" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
strip = false
debug = true
