[package]
name = "sandbox-wasm"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sandbox"
authors = ["Frontal Labs"]
title = "Sandbox Wasm"
description = "WASM/WASI host for the sandbox system"

[dependencies]
sandbox-types = { path = "../sandbox-types" }
sandbox-vfs = { path = "../sandbox-vfs" }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
wasmtime = { workspace = true }
    futures = { workspace = true }
    toml = "0.8"

[dev-dependencies]
sandbox-cas = { path = "../sandbox-cas" }

[features]
default = []
