name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - uses: Swatinem/rust-cache@v2
      # sandbox-proto's build script runs protoc (see docs/DEVELOPMENT.md).
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler && protoc --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Bench compile check
        run: cargo bench --workspace --no-run

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build --workspace sandbox-sdk
      - name: Test
        run: npm test --workspace sandbox-sdk
      - name: Pack check
        run: |
          cd sdks/typescript
          npm pack --dry-run >/dev/null

  sdk-python:
    name: Python SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e "sdks/python[dev]"
      - name: Lint
        run: ruff check sdks/python/sandbox_sdk
      - name: Test
        run: pytest sdks/python/tests -q
