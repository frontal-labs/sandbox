[package]
name = "sandbox-worker"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sandbox"
authors = ["Frontal Labs"]
description = "Worker process for the sandbox system"

[dependencies]
sandbox-types = { path = "../sandbox-types" }
sandbox-session = { path = "../sandbox-session" }
sandbox-runtime = { path = "../sandbox-runtime" }
sandbox-vfs = { path = "../sandbox-vfs" }
sandbox-proto = { path = "../sandbox-proto" }
ulid = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
tokio-stream = { workspace = true, features = ["net"] }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
rustix = { workspace = true }
nix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
seccompiler = { workspace = true }