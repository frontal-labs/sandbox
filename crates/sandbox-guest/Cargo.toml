[package]
name = "sandbox-guest"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sandbox"
authors = ["Frontal Labs"]
description = "Guest agent for the sandbox system"

[dependencies]
sandbox-types = { path = "../sandbox-types" }
sandbox-proto = { path = "../sandbox-proto" }
sandbox-vfs = { path = "../sandbox-vfs" }
sandbox-cas = { path = "../sandbox-cas" }
sandbox-shell = { path = "../sandbox-shell" }
tokio = { workspace = true }
tokio-stream = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
vsock = { workspace = true, optional = true }

[[bin]]
name = "sandbox-guest-agent"
path = "src/main.rs"

[features]
default = []
vsock = ["dep:vsock"]