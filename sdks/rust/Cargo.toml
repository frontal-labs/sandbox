[package]
name = "sandbox-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sandbox"
authors = ["Frontal Labs"]
description = "Rust SDK for the sandbox system"

[dependencies]
sandbox-types = { version = "0.1.0", path = "../../crates/sandbox-types" }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }

# The integration tests start a real in-process sandbox-server, so they need
# the workspace crates (path deps), which resolve locally. `cargo package`
# includes the `tests/` dir, so these must be resolvable to publish; they all
# point into the workspace, so they resolve without being on crates.io.
[dev-dependencies]
axum = { workspace = true }
sandbox-server = { path = "../../crates/sandbox-server" }
sandbox-scheduler = { path = "../../crates/sandbox-scheduler" }
sandbox-session = { path = "../../crates/sandbox-session" }
sandbox-runtime = { path = "../../crates/sandbox-runtime" }
