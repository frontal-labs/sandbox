name: SDK release

# Changesets turns pending changesets into a "Version SDKs" pull request. Merging
# that pull request publishes the new version: each SDK is packed and pushed to
# GHCR, then the version is tagged and a GitHub release is created.
#
# Run it by hand with dry_run on (the default) to check the packing without
# pushing anything.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only. Do not push to GHCR or create a release."
        type: boolean
        default: true

# Read-only by default. Each job below asks for the write scope it needs.
permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Open or update the version PR
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: npm ci
      - name: Open the version PR, or version the packages when it is merged
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: npm run version-packages
          commit: "chore(release): version SDKs"
          title: "chore(release): version SDKs"
          createGithubReleases: false
        env:
          # PRs opened with GITHUB_TOKEN do not trigger pull_request workflows, so the
          # version PR would get no CI. A token from a PAT or GitHub App fixes that.
          # Without the secret, this falls back to GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.SDK_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    name: Publish ${{ matrix.sdk }} to GHCR
    if: >-
      always() && !cancelled() && !failure() &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        sdk: [ts, py, rs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Stop while changesets are still pending
        id: pending
        run: |
          pending=$(ls .changeset/*.md 2>/dev/null | grep -v README.md | wc -l | tr -d ' ')
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" != "0" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "Changesets are pending; the version PR has not been merged yet. Skipping."
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.pending.outputs.pending == '0' || github.event_name == 'workflow_dispatch'
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.sdk == 'py' && (steps.pending.outputs.pending == '0' || github.event_name == 'workflow_dispatch')
        with:
          python-version: "3.12"
      - name: Install TypeScript dependencies
        if: matrix.sdk == 'ts' && (steps.pending.outputs.pending == '0' || github.event_name == 'workflow_dispatch')
        run: npm ci
      - name: Install packaging tools
        if: matrix.sdk == 'py' && (steps.pending.outputs.pending == '0' || github.event_name == 'workflow_dispatch')
        run: python -m pip install build
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        if: steps.pending.outputs.pending == '0' || github.event_name == 'workflow_dispatch'
      - name: Log in to GHCR
        if: (steps.pending.outputs.pending == '0' || github.event_name == 'workflow_dispatch') && github.event.inputs.dry_run != 'true'
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | oras login ghcr.io --username "$ACTOR" --password-stdin
      - name: Pack and push
        if: steps.pending.outputs.pending == '0' || github.event_name == 'workflow_dispatch'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          SDK: ${{ matrix.sdk }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            scripts/release/publish-sdk.sh "$SDK" --dry-run
          else
            scripts/release/publish-sdk.sh "$SDK"
          fi

  publish-npm:
    name: Publish TypeScript SDK to npm
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      (github.event_name == 'push' || github.event.inputs.dry_run == 'false')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Stop while changesets are still pending
        id: pending
        run: |
          pending=$(ls .changeset/*.md 2>/dev/null | grep -v README.md | wc -l | tr -d ' ')
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" != "0" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "Changesets are pending; the version PR has not been merged yet. Skipping."
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.pending.outputs.pending == '0' || github.event_name == 'workflow_dispatch'
        with:
          node-version: "22"
          cache: npm
      - name: Install
        if: steps.pending.outputs.pending == '0' || github.event_name == 'workflow_dispatch'
        run: npm ci
      - name: Build TypeScript SDK
        if: steps.pending.outputs.pending == '0' || github.event_name == 'workflow_dispatch'
        working-directory: sdks/typescript
        run: npm run build
      - name: Publish
        if: steps.pending.outputs.pending == '0' || github.event_name == 'workflow_dispatch'
        working-directory: sdks/typescript
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}"
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run
          else
            npm publish --access public
          fi

  release:
    name: Tag the release
    needs: [publish, publish-npm]
    if: >-
      needs.publish.result == 'success' &&
      (github.event_name == 'push' || github.event.inputs.dry_run == 'false')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pending=$(ls .changeset/*.md 2>/dev/null | grep -v README.md | wc -l | tr -d ' ')
          if [ "$pending" != "0" ]; then
            echo "Changesets are still pending. Nothing to tag yet."
            exit 0
          fi
          version=$(node -p "require('./sdks/typescript/package.json').version")
          tag="sdk-v${version}"
          # actions/checkout does not fetch tags, so ask the remote.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to release"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --title "SDKs $version" --generate-notes
