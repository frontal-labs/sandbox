openapi: 3.1.0
info:
  title: Frontal Sandbox API
  description: 'REST API for sandboxes: sessions, commands, files, and snapshots. Snapshots capture the committed filesystem. Settings the backend does not enforce are refused with 501.'
  contact:
    name: Frontal Labs
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: v1
paths:
  /v1/gc:
    post:
      tags:
      - admin
      summary: |-
        Start a garbage collection of the blob store. It runs in the background, so
        the request does not wait for it (PLAN §4.2). The report is written to the
        log when it finishes.
      description: |-
        Any key may call it. A collection holds every session's gate for a moment,
        so the server allows one per minute, and a call inside that window gets
        `RESOURCE_EXHAUSTED`.
      operationId: run_gc
      responses:
        '202':
          description: Collection started in the background
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: A collection started less than a minute ago
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /v1/sessions:
    post:
      tags:
      - sessions
      summary: Create a session from a config. The session is owned by the calling key.
      operationId: create_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionConfig'
        required: true
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '400':
          description: Invalid session config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: initial_snapshot is not one of this key's snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: A requested setting is not enforced yet, so the request is refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /v1/sessions/{id}:
    get:
      tags:
      - sessions
      summary: Read a session's state.
      operationId: get_session
      parameters:
      - name: id
        in: path
        description: Session ID (ULID)
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such session for this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
    delete:
      tags:
      - sessions
      summary: Destroy a session.
      operationId: destroy_session
      parameters:
      - name: id
        in: path
        description: Session ID (ULID)
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      responses:
        '204':
          description: Session destroyed
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such session for this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /v1/sessions/{id}/exec:
    post:
      tags:
      - exec
      summary: |-
        Run one command in a session. With `stream`, the output comes as NDJSON
        `ExecEvent` lines while the command runs (PLAN §4.15).
      operationId: exec_command
      parameters:
      - name: id
        in: path
        description: Session ID (ULID)
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
        required: true
      responses:
        '200':
          description: Command finished. Buffered, the whole result. Streamed (`?stream=true`), `application/x-ndjson` lines, each an `ExecEvent`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecResult'
        '400':
          description: Invalid request, such as an empty argv
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such session for this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /v1/sessions/{id}/fs/{path}:
    get:
      tags:
      - fs
      summary: Read a file from a session's filesystem.
      operationId: read_file
      parameters:
      - name: id
        in: path
        description: Session ID (ULID)
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      - name: path
        in: path
        description: Absolute path inside the session, without the leading slash
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File contents
          content:
            application/octet-stream: {}
        '400':
          description: Path is a directory or contains '..'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such session, or no such file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          description: File is larger than the 16 MiB read limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
    put:
      tags:
      - fs
      summary: Write a file in a session's filesystem, creating or replacing it.
      operationId: write_file
      parameters:
      - name: id
        in: path
        description: Session ID (ULID)
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      - name: path
        in: path
        description: Absolute path inside the session, without the leading slash
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: array
              items:
                type: integer
                format: int32
                minimum: 0
        required: true
      responses:
        '204':
          description: File written
        '400':
          description: Path is a directory or contains '..'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
    delete:
      tags:
      - fs
      summary: Delete a file or an empty directory in a session's filesystem.
      operationId: delete_file
      parameters:
      - name: id
        in: path
        description: Session ID (ULID)
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      - name: path
        in: path
        description: Absolute path inside the session, without the leading slash
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '400':
          description: Path contains '..', or a non-empty directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such session, or no such path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /v1/sessions/{id}/sleep:
    post:
      tags:
      - sessions
      summary: |-
        Put a session to sleep. The filesystem is checkpointed and recorded as a
        snapshot, and the live session is released, so a sleeping session holds no
        VFS in memory. Shell state (working directory and environment) is not kept,
        so a woken session starts with fresh shell state. See ADR 0006.
      operationId: sleep_session
      parameters:
      - name: id
        in: path
        description: Session ID (ULID)
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      responses:
        '200':
          description: Session is asleep; the snapshot is its wake root
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeSnapshotResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such session for this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The session is already asleep
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /v1/sessions/{id}/snapshot:
    post:
      tags:
      - snapshots
      summary: |-
        Take a snapshot of a session's committed filesystem. The caller owns the
        snapshot, and only that key can fork it or start a session from it.
      operationId: take_snapshot
      parameters:
      - name: id
        in: path
        description: Session ID (ULID)
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      responses:
        '201':
          description: Snapshot taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeSnapshotResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such session for this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /v1/sessions/{id}/snapshots:
    get:
      tags:
      - snapshots
      summary: List the snapshots taken from one session.
      operationId: list_snapshots
      parameters:
      - name: id
        in: path
        description: Session ID (ULID)
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      responses:
        '200':
          description: Snapshots taken from this session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Snapshot'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such session for this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /v1/sessions/{id}/snapshots/{snapshot_id}:
    get:
      tags:
      - snapshots
      summary: Read one snapshot taken from a session.
      operationId: get_snapshot
      parameters:
      - name: id
        in: path
        description: Session ID (ULID)
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      - name: snapshot_id
        in: path
        description: Snapshot ID (ULID)
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      responses:
        '200':
          description: The snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such session or snapshot for this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /v1/sessions/{id}/trace:
    get:
      tags:
      - sessions
      summary: The session's trace, one run per line, in the ADR 0007 format (ADR 0009).
      operationId: get_trace
      parameters:
      - name: id
        in: path
        description: Session ID (ULID)
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      responses:
        '200':
          description: The trace. X-Trace-Complete is false when a command could not be recorded or the trace is full
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such session for this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /v1/sessions/{id}/wake:
    post:
      tags:
      - sessions
      summary: |-
        Wake a sleeping session. The filesystem is restored from the root that
        sleep recorded. The session keeps its ID.
      operationId: wake_session
      parameters:
      - name: id
        in: path
        description: Session ID (ULID)
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      responses:
        '200':
          description: Session is running again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such session for this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The session is not asleep
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /v1/snapshots/{id}/fork:
    post:
      tags:
      - snapshots
      summary: |-
        Fork a snapshot into new sessions, each owned by the caller. The caller must
        own the snapshot.
      operationId: fork_snapshot
      parameters:
      - name: id
        in: path
        description: Snapshot ID (ULID)
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkRequest'
        required: true
      responses:
        '200':
          description: Sessions created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForkResponse'
        '400':
          description: Count must be between 1 and 64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such snapshot for this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /v1/usage:
    get:
      tags:
      - usage
      summary: The caller's usage counters since this server started.
      operationId: get_usage
      responses:
        '200':
          description: The caller's counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Counters'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
components:
  schemas:
    Counters:
      type: object
      description: |-
        What one key has used. Counts since the server started, and held in memory,
        so a restart resets them. They are not billing records (PLAN §4.14).
      required:
      - sessions_created
      - sessions_slept
      - sessions_woken
      - execs
      - exec_wall_ms
      - bytes_written
      properties:
        bytes_written:
          type: integer
          format: int64
          description: Bytes written through the filesystem API.
          minimum: 0
        exec_wall_ms:
          type: integer
          format: int64
          description: Wall time of the commands the key ran, in milliseconds.
          minimum: 0
        execs:
          type: integer
          format: int64
          minimum: 0
        sessions_created:
          type: integer
          format: int64
          minimum: 0
        sessions_slept:
          type: integer
          format: int64
          minimum: 0
        sessions_woken:
          type: integer
          format: int64
          minimum: 0
    CreateSessionResponse:
      type: object
      required:
      - session_id
      properties:
        session_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    ErrorBody:
      type: object
      description: Error body for every non-2xx response on `/v1`.
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
    ErrorCode:
      type: string
      enum:
      - INTERNAL
      - INVALID_ARGUMENT
      - NOT_FOUND
      - ALREADY_EXISTS
      - PERMISSION_DENIED
      - RESOURCE_EXHAUSTED
      - UNAVAILABLE
      - TIMEOUT
      - CANCELLED
      - INVALID_STATE
      - UNSUPPORTED
      - POLICY_DENIED
      - PROMOTION_FAILED
      - SNAPSHOT_FAILED
      - VM_BOOT_FAILED
      - NETWORK_ERROR
      - CAS_ERROR
      - VFS_ERROR
      - SHELL_ERROR
      - RUNTIME_ERROR
      - WASM_ERROR
    ExecEvent:
      oneOf:
      - type: object
        description: Output of the command, in order. Bytes are integer arrays, as in `ExecResult`.
        required:
        - stream
        - data
        - type
        properties:
          data:
            type: array
            items:
              type: integer
              format: int32
              minimum: 0
          stream:
            $ref: '#/components/schemas/OutputStream'
          type:
            type: string
            enum:
            - output
      - type: object
        description: The command finished. Its output was sent in `Output` lines before this.
        required:
        - exit_code
        - cpu_ms
        - wall_ms
        - type
        properties:
          cpu_ms:
            type: integer
            format: int64
            minimum: 0
          exit_code:
            type: integer
            format: int32
          type:
            type: string
            enum:
            - exit
          wall_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        description: The command failed or was cut short, such as by its timeout.
        required:
        - code
        - message
        - type
        properties:
          code:
            $ref: '#/components/schemas/ErrorCode'
          message:
            type: string
          type:
            type: string
            enum:
            - error
      description: |-
        One line of a streamed exec response (NDJSON, PLAN §4.15). Output lines arrive
        while the command runs. Exactly one `Exit` or `Error` line ends the response.
    ExecRequest:
      type: object
      required:
      - argv
      - env
      - stream
      properties:
        argv:
          type: array
          items:
            type: string
        cwd:
          type:
          - string
          - 'null'
        env:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        stdin:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
            minimum: 0
          description: Bytes as an integer array, 0-255 each (serde default).
        stream:
          type: boolean
          description: |-
            Stream the output while the command runs, as NDJSON. Set by the server
            from `?stream=true` or from this field. Buffered callers leave it `false`.
        timeout_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    ExecResult:
      type: object
      required:
      - exit_code
      - stdout
      - stderr
      - cpu_ms
      - wall_ms
      properties:
        cpu_ms:
          type: integer
          format: int64
          minimum: 0
        exit_code:
          type: integer
          format: int32
        stderr:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
          description: Bytes as an integer array, 0-255 each (serde default).
        stdout:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
          description: Bytes as an integer array, 0-255 each (serde default).
        wall_ms:
          type: integer
          format: int64
          minimum: 0
    ForkRequest:
      type: object
      required:
      - count
      properties:
        count:
          type: integer
          format: int32
          description: Number of sessions to create from the snapshot.
          minimum: 0
    ForkResponse:
      type: object
      required:
      - session_ids
      properties:
        session_ids:
          type: array
          items:
            type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    NetworkPolicy:
      type: object
      required:
      - default_deny
      - rules
      properties:
        default_deny:
          type: boolean
        rules:
          type: array
          items:
            $ref: '#/components/schemas/NetworkPolicyRule'
    NetworkPolicyRule:
      type: object
      required:
      - action
      - host_pattern
      properties:
        action:
          $ref: '#/components/schemas/PolicyAction'
        host_pattern:
          type: string
        ports:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
            minimum: 0
    OutputStream:
      type: string
      description: Which output stream a streamed chunk came from.
      enum:
      - stdout
      - stderr
    PolicyAction:
      type: string
      enum:
      - allow
      - deny
    ResourceLimits:
      type: object
      properties:
        cpu_ms_per_sec:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        max_file_size:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        max_inodes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        max_open_files:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        max_path_depth:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        max_processes:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        max_total_size:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        memory_bytes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        wall_timeout_secs:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    SecretEntry:
      type: object
      required:
      - value
      - hosts
      properties:
        hosts:
          type: array
          items:
            type: string
        value:
          type: string
    SecretsConfig:
      type: object
      required:
      - secrets
      properties:
        secrets:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SecretEntry'
          propertyNames:
            type: string
    SessionConfig:
      type: object
      required:
      - tenant_id
      - tier_preference
      - limits
      - network
      - env
      - cwd
      - labels
      properties:
        cwd:
          type: string
        env:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        initial_snapshot:
          type:
          - string
          - 'null'
