name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. A job that writes asks for the scope it needs.
permissions:
  contents: read

env:
  # Make the v8 build script rerun when the Rust cache contains build metadata
  # but not the downloaded native archive.
  RUSTY_V8_MIRROR: https://github.com/denoland/rusty_v8/releases/download
  V8_FROM_SOURCE: "0"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - uses: Swatinem/rust-cache@v2
      # The runner's disk filled during the workspace build. These preinstalled
      # toolchains are not used by this job.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android && df -h /
      # sandbox-proto's build script runs protoc (see docs/DEVELOPMENT.md).
      - name: Install protoc
        run: >-
          sudo apt-get
          -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
          -o Dir::Etc::sourceparts=- update
          && sudo apt-get install -y protobuf-compiler
          && protoc --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Bench compile check
        run: cargo bench --workspace --no-run

  # PLAN §5: cargo-deny (licenses, advisories, sources) and cargo-audit run on
  # every change. Versions are pinned to the ones the policy was checked with.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: Licenses, advisories, bans, and sources
        run: cargo deny check
      - name: Advisory database (.cargo/audit.toml)
        run: cargo audit --deny warnings

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build --workspace @frontal-labs/sandbox-sdk
      - name: Test
        run: npm test --workspace @frontal-labs/sandbox-sdk
      - name: Pack check
        run: |
          cd sdks/typescript
          npm pack --dry-run >/dev/null

  sdk-python:
    name: Python SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e "sdks/python[dev]"
      - name: Lint
        run: ruff check sdks/python/sandbox_sdk
      - name: Test
        run: pytest sdks/python/tests -q

  sdk-live:
    name: Live SDK tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The CLI depends on sandbox-proto, whose build script runs protoc, and the
      # debug build needs the disk space freed here.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android && df -h /
      - name: Install protoc
        run: >-
          sudo apt-get
          -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
          -o Dir::Etc::sourceparts=- update
          && sudo apt-get install -y protobuf-compiler
          && protoc --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -e "sdks/python[dev]"
      - name: Build the server
        run: cargo build -p cli --bin frontal-sandbox
      - name: Start the server
        run: |
          nohup ./target/debug/frontal-sandbox serve --addr 127.0.0.1:8080 > server.out 2> server.err &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/v1/openapi.json > /dev/null && break
            sleep 1
          done
          KEY=$(sed -n 's/^API key (shown once): //p' server.err | tail -1)
          test -n "$KEY"
          echo "::add-mask::$KEY"
          echo "SANDBOX_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "SANDBOX_BASE_URL=http://127.0.0.1:8080" >> "$GITHUB_ENV"
      - name: TypeScript live tests
        run: npm test --workspace @frontal-labs/sandbox-sdk
      - name: Python live tests
        run: python -m pytest sdks/python/tests -q
      - name: Server log
        if: always()
        run: cat server.err || true
