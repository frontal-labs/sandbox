[workspace]
resolver = "2"
members = [
    "crates/sandbox-types",
    "crates/sandbox-vfs",
    "crates/sandbox-cas",
    "crates/sandbox-shell",
    "crates/sandbox-runtime",
    "crates/sandbox-wasm",
    "crates/sandbox-session",
    "crates/sandbox-snapshot",
    "crates/sandbox-vmm",
    "crates/sandbox-guest",
    "crates/sandbox-promote",
    "crates/sandbox-policy",
    "crates/sandbox-trace",
    "crates/sandbox-worker",
    "crates/sandbox-scheduler",
    "crates/sandbox-server",
    "crates/sandbox-sdk",
    "crates/sandbox-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sandbox"
authors = ["Frontal Labs"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
parking_lot = "0.12"
proptest = "1"
criterion = "0.5"
dashmap = "6"
schemars = "0.8"
ulid = { version = "1", features = ["serde"] }
blake3 = "1"
object_store = "0.12"
zstd = "0.13"
wasmtime = "36"
deno_core = "0.367"
async-stream = "0.3"
futures = "0.3"
bytes = "1"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
async-trait = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
pin-project = "1"
pin-utils = "0.1"
insta = "1"
clap = { version = "4", features = ["derive"] }
notify = "6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
