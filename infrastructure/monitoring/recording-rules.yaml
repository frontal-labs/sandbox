groups:
  - name: sandbox.recording
    rules:
      - record: job:sandbox_session_starts:rate1m
        expr: rate(sandbox_session_starts_total[1m])

      - record: job:sandbox_exec_latency:histogram_quantile_p99
        expr: histogram_quantile(0.99, rate(sandbox_exec_duration_seconds_bucket[5m]))

      - record: job:sandbox_cas_hit_rate
        expr: rate(sandbox_cas_hits_total[5m]) / rate(sandbox_cas_requests_total[5m])
