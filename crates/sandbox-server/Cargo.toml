[package]
name = "sandbox-server"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sandbox"
authors = ["Frontal Labs"]
description = "API server for the sandbox system"

[dependencies]
sandbox-types = { path = "../sandbox-types", features = ["openapi"] }
sandbox-scheduler = { path = "../sandbox-scheduler" }
sandbox-session = { path = "../sandbox-session" }
sandbox-vfs = { path = "../sandbox-vfs" }
sandbox-cas = { path = "../sandbox-cas" }
sandbox-vmm = { path = "../sandbox-vmm" }
sandbox-promote = { path = "../sandbox-promote" }
sandbox-wasm = { path = "../sandbox-wasm" }
sandbox-trace = { path = "../sandbox-trace" }
tokio = { workspace = true }
sqlx = { workspace = true, optional = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
hyper = { workspace = true }
utoipa = { workspace = true }
argon2 = { workspace = true }
blake3 = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures = { workspace = true }
sandbox-runtime = { path = "../sandbox-runtime" }
tokio-tungstenite = "0.24"
tower = { workspace = true, features = ["util"] }

[features]
default = []
# The Postgres state store, for several nodes sharing one database (PLAN §4.8, M5).
clustered = ["sqlx"]