name: Release Sandbox binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  NODE_VERSION: "22"

jobs:
  cli:
    name: frontal-sandbox CLI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, os_name: darwin, arch: arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, os_name: darwin, arch: x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, os_name: linux, arch: x64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, os_name: linux, arch: arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, os_name: win32, arch: x64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://npm.pkg.github.com"
      # sandbox-proto's build script runs protoc. Each runner installs its own.
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get
          -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
          -o Dir::Etc::sourceparts=- update
          && sudo apt-get install -y protobuf-compiler
          && protoc --version
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf && protoc --version
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y; protoc --version
      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The ARM Linux build runs on an x86 runner, so it needs a cross toolchain.
      - name: Install cross toolchain (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build CLI
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          # `sandbox --version` reports the release version, taken from the tag.
          # `frontal-sandbox` is the legacy alias, built from the same source.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export SANDBOX_VERSION="${GITHUB_REF_NAME#v}"
          else
            export SANDBOX_VERSION="0.0.0-dryrun"
          fi
          cargo build --release -p cli --target ${{ matrix.target }} --bin sandbox --bin frontal-sandbox
      - name: Release version and publish mode
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "NPM_FLAGS=" >> "$GITHUB_ENV"
          else
            # A manual run is not a release. It gets a throwaway version and dry-runs the publish.
            echo "RELEASE_VERSION=0.0.0-dryrun" >> "$GITHUB_ENV"
            echo "NPM_FLAGS=--dry-run" >> "$GITHUB_ENV"
          fi
      - name: Package CLI binary
        shell: bash
        run: |
          # Both the canonical `sandbox` and the legacy `frontal-sandbox` are built
          # from the same source. Each platform package ships the canonical binary.
          EXE=sandbox
          if [ "${{ matrix.os_name }}" = "win32" ]; then EXE=sandbox.exe; fi
          BIN="target/${{ matrix.target }}/release/$EXE"
          PKG_DIR="target/npm-pkg/${{ matrix.target }}"
          mkdir -p "$PKG_DIR"
          cp "$BIN" "$PKG_DIR/$EXE"
          # Each platform package needs its own package.json, or npm publish fails.
          VERSION="$RELEASE_VERSION"
          node -e '
            const [pkgDir, target, osName, arch, exe, version] = process.argv.slice(1)
            const pkg = {
              name: `@frontal-labs/sandbox-cli-${target}`,
              version,
              description: `sandbox CLI binary for ${target}`,
              os: [osName],
              cpu: [arch],
              files: [exe],
              license: "Apache-2.0",
              repository: "https://github.com/frontal-labs/sandbox",
              publishConfig: { registry: "https://npm.pkg.github.com" },
            }
            require("fs").writeFileSync(pkgDir + "/package.json", JSON.stringify(pkg, null, 2))
          ' "$PKG_DIR" "${{ matrix.target }}" "${{ matrix.os_name }}" "${{ matrix.arch }}" "$EXE" "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandbox-${{ matrix.target }}
          path: target/npm-pkg/${{ matrix.target }}

  publish-npm:
    name: Publish to npm
    needs: [cli]
    runs-on: ubuntu-latest
    # A tag publishes. A manual run only dry-runs the publish, so the packaging is
    # checked without releasing anything.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://npm.pkg.github.com"
      - name: Release version and publish mode
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "NPM_FLAGS=" >> "$GITHUB_ENV"
          else
            # A manual run is not a release. It gets a throwaway version and dry-runs the publish.
            echo "RELEASE_VERSION=0.0.0-dryrun" >> "$GITHUB_ENV"
            echo "NPM_FLAGS=--dry-run" >> "$GITHUB_ENV"
          fi
      - name: Publish platform packages
        run: |
          for dir in dist/*/; do
            (cd "$dir" && npm publish --access public $NPM_FLAGS)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the sandbox-cli wrapper
        # The wrapper lists each platform package in optionalDependencies at the
        # same version, so it is published after them.
        run: |
          VERSION="$RELEASE_VERSION"
          WRAP="$RUNNER_TEMP/sandbox-cli"
          rm -rf "$WRAP" && cp -r npm/sandbox-cli "$WRAP"
          node -e '
            const fs = require("fs")
            const dir = process.argv[1], version = process.argv[2]
            const pkg = JSON.parse(fs.readFileSync(dir + "/package.json", "utf8"))
            pkg.version = version
            pkg.optionalDependencies = Object.fromEntries(
              fs.readdirSync(process.argv[3])
                .map((d) => JSON.parse(fs.readFileSync(process.argv[3] + "/" + d + "/package.json", "utf8")).name)
                .map((name) => [name, version])
            )
            fs.writeFileSync(dir + "/package.json", JSON.stringify(pkg, null, 2))
          ' "$WRAP" "$VERSION" "$GITHUB_WORKSPACE/dist"
          (cd "$WRAP" && npm publish --access public $NPM_FLAGS)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Attach to release
    needs: [cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist }
      - name: Name each binary after its target
        # Each platform's binary is called `sandbox`, so the uploads would overwrite
        # each other. Each one is copied under its target name first, and the legacy
        # alias is copied too, so both `sandbox-<target>` and `frontal-sandbox-<target>`
        # are attached to the release.
        run: |
          mkdir -p release-assets
          for dir in dist/*/; do
            target="${dir#dist/sandbox-}"
            target="${target%/}"
            for file in "$dir"sandbox*; do
              name="$(basename "$file")"
              ext="${name#sandbox}"
              cp "$file" "release-assets/sandbox-${target}${ext}"
              cp "$file" "release-assets/frontal-sandbox-${target}${ext}"
            done
          done
          ls -l release-assets
      - name: Write SHA-256 checksums
        # One file for all binaries, in the format `sha256sum -c` reads. Homebrew and
        # manual installs can verify a download against it.
        run: |
          cd release-assets
          sha256sum frontal-sandbox-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub release and attach the binaries
        # This is the only workflow that creates a release for a v* tag, so the
        # binaries and the notes land on one release.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: release-assets/*
