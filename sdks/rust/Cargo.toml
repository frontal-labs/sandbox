[package]
name = "frontal-sandbox-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sandbox"
authors = ["Frontal Labs"]
title = "Sandbox Sdk"
description = "Rust SDK for the sandbox system"

[dependencies]
sandbox-types = { version = "0.0.0", path = "../../crates/sandbox-types" }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
sandbox-server = { path = "../../crates/sandbox-server" }
sandbox-scheduler = { path = "../../crates/sandbox-scheduler" }
sandbox-session = { path = "../../crates/sandbox-session" }
sandbox-runtime = { path = "../../crates/sandbox-runtime" }
