[package]
name = "sandbox-vmm"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sandbox"
authors = ["Frontal Labs"]
description = "QEMU VM driver for Tier 2 microVM execution"

[dependencies]
sandbox-types = { path = "../sandbox-types" }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
hyper = { workspace = true }
hyperlocal = { workspace = true }
seccompiler = { workspace = true, optional = true }
rustix = { workspace = true }
nix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
tonic = { workspace = true }
which = "6"
sandbox-proto = { path = "../sandbox-proto" }

[features]
default = []
seccomp = ["seccompiler"]

[dev-dependencies]
