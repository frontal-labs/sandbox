[package]
name = "sandbox-shell"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sandbox"
authors = ["Frontal Labs"]
title = "Sandbox Shell"
description = "Shell parser, interpreter, and builtins for the sandbox system"

[dependencies]
sandbox-types = { path = "../sandbox-types" }
sandbox-vfs = { path = "../sandbox-vfs" }
sandbox-runtime = { path = "../sandbox-runtime" }
sandbox-wasm = { path = "../sandbox-wasm" }
tokio = { workspace = true }
regex = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
sandbox-cas = { path = "../sandbox-cas" }
serde_json = { workspace = true }

[features]
default = []