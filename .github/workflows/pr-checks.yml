name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. A job that writes asks for the scope it needs.
permissions:
  contents: read

jobs:
  title:
    name: Validate Title
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pattern = /^(feat|fix|chore|docs|refactor|test|perf|ci|build|style|revert)(\(.+\))?!?:\s.+/
            const title = context.payload.pull_request.title
            if (!pattern.test(title)) {
              core.setFailed(
                `PR title "${title}" does not match conventional commit format.\n` +
                'Expected: type(scope)!: description\n' +
                'Types: feat, fix, chore, docs, refactor, test, perf, ci, build, style, revert'
              )
            }

  labels:
    name: Validate Labels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Bot PRs (Renovate, Dependabot, and the changesets version PR) have no
            // semver label. Their version is set by the bot, not by a human.
            if (context.payload.pull_request.user.type === 'Bot') {
              core.info('Bot PR. No semver label needed.')
              return
            }
            const required = ['semver-patch', 'semver-minor', 'semver-major']
            const labels = context.payload.pull_request.labels.map(l => l.name)
            const hasSemver = required.some(r => labels.includes(r))
            if (!hasSemver) {
              core.setFailed(
                'PR must have a semver label: semver-patch, semver-minor, or semver-major'
              )
            }

  size:
    name: Check Size
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process')
            const diff = execSync('git diff --stat origin/main...HEAD').toString()
            const lines = diff.trim().split('\n').pop()
            const match = lines?.match(/(\d+)/)
            const changes = match ? parseInt(match[1]) : 0
            const limit = 500
            if (changes > limit) {
              core.warning(
                `Large PR: ${changes} changes (limit is ${limit}). ` +
                'Consider splitting into smaller PRs for faster review.'
              )
            }
            core.setOutput('changes', changes.toString())

  changeset:
    name: Changeset for SDK changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a changeset when the SDKs change
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          # The version PR is made by changesets itself and consumes the changesets.
          case "$HEAD_BRANCH" in
            changeset-release/*) echo "Version PR. No changeset needed."; exit 0 ;;
          esac
          if [ -z "$(git diff --name-only "$BASE...HEAD" -- sdks)" ]; then
            echo "No SDK changes."
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$BASE...HEAD" -- .changeset | grep -v 'README.md' || true)
          if [ -z "$added" ]; then
            echo "::error::This PR changes the SDKs. Add a changeset with 'npm run changeset' and commit the file."
            exit 1
          fi

  assign:
    name: Auto Assign
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login
            if (context.payload.pull_request.assignees.length === 0) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: [author]
              })
            }
