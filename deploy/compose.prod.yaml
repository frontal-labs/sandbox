# =============================================================================
# Frontal Sandbox — production compose stack
# =============================================================================
# Extends docker/compose.yaml with TLS, metrics publishing, and a config file.
#
# Usage (from the repository root):
#   cp deploy/.env.example deploy/.env        # optional overrides
#   docker compose -f docker/compose.yaml -f deploy/compose.prod.yaml up -d --build --wait
#
# Mount TLS certs into deploy/tls/ (server.crt, server.key) and set
# SANDBOX_TLS=1 to enable HTTPS. The server's config file is read from
# deploy/config/ (bind-mounted read-only) via SANDBOX_CONFIG.
# =============================================================================

name: frontal-sandbox-prod

services:
  sandbox:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:-1.95}
        DEBIAN_SUITE: ${DEBIAN_SUITE:-bookworm}
    image: ${SANDBOX_IMAGE:-frontal-sandbox:prod}
    restart: unless-stopped
    stop_grace_period: 30s

    ports:
      - "${SANDBOX_HOST_BIND:-0.0.0.0}:${SANDBOX_PORT:-8080}:8080"
      - "${METRICS_HOST_BIND:-127.0.0.1}:${METRICS_PORT:-9090}:9090"

    environment:
      SANDBOX_CONFIG: /etc/sandbox/config.toml
      SANDBOX_TLS: ${SANDBOX_TLS:-0}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-1}

    volumes:
      - sandbox-state:/var/lib/sandbox
      - ./config:/etc/sandbox:ro
      - ./tls:/etc/sandbox/tls:ro

    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${SANDBOX_PIDS_LIMIT:-512}
    mem_limit: ${SANDBOX_MEM_LIMIT:-8g}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/openapi.json"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  sandbox-state:
    name: ${SANDBOX_STATE_VOLUME:-frontal-sandbox-state-prod}
