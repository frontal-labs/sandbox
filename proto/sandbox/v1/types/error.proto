syntax = "proto3";

package sandbox.v1.types;

// Mirrors sandbox_types::ErrorCode one for one. Values are never reused.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INTERNAL = 1;
  ERROR_CODE_INVALID_ARGUMENT = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_ALREADY_EXISTS = 4;
  ERROR_CODE_PERMISSION_DENIED = 5;
  ERROR_CODE_RESOURCE_EXHAUSTED = 6;
  ERROR_CODE_UNAVAILABLE = 7;
  ERROR_CODE_TIMEOUT = 8;
  ERROR_CODE_CANCELLED = 9;
  ERROR_CODE_INVALID_STATE = 10;
  ERROR_CODE_UNSUPPORTED = 11;
  ERROR_CODE_POLICY_DENIED = 12;
  ERROR_CODE_PROMOTION_FAILED = 13;
  ERROR_CODE_SNAPSHOT_FAILED = 14;
  ERROR_CODE_VM_BOOT_FAILED = 15;
  ERROR_CODE_NETWORK_ERROR = 16;
  ERROR_CODE_CAS_ERROR = 17;
  ERROR_CODE_VFS_ERROR = 18;
  ERROR_CODE_SHELL_ERROR = 19;
  ERROR_CODE_RUNTIME_ERROR = 20;
  ERROR_CODE_WASM_ERROR = 21;
  ERROR_CODE_NEEDS_VM = 22;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}
