name: Release Sandbox binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  NODE_VERSION: "22"

jobs:
  cli:
    name: sandbox CLI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, os_name: darwin, arch: arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, os_name: darwin, arch: x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, os_name: linux, arch: x64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, os_name: linux, arch: arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, os_name: win32, arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://npm.pkg.github.com"
      - name: Install Rust
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build --release -p sandbox-cli --target ${{ matrix.target }}
      - name: Package CLI binary
        shell: bash
        run: |
          LIB="target/${{ matrix.target }}/release/sandbox"
          PKG_DIR="target/npm-pkg/${{ matrix.target }}"
          mkdir -p "$PKG_DIR"
          cp "$LIB" "$PKG_DIR/sandbox"
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-${{ matrix.target }}
          path: target/npm-pkg/${{ matrix.target }}

  publish-npm:
    name: Publish to npm
    needs: [cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://npm.pkg.github.com"
      - name: Publish platform packages
        run: |
          for dir in dist/*/; do
            (cd "$dir" && npm publish --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Attach to release
    needs: [cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Publish to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
